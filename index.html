<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Under Maintenance</title>
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Padauk', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Dialog Container */
        .maintenance-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 450px;
            width: 90%;
            position: relative;
            animation: popUp 0.5s ease-out;
        }

        /* Icon Animation */
        .icon-container {
            width: 80px;
            height: 80px;
            background: #f0f2f5;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px auto;
            color: #764ba2;
            font-size: 32px;
        }

        .fa-gear {
            animation: spin 4s linear infinite;
        }

        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
            font-size: 16px;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: transform 0.2s;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
        }

        /* Animations */
        @keyframes popUp {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="maintenance-card">
        <div class="icon-container">
            <i class="fa-solid fa-screwdriver-wrench"></i>
            </div>
        
        <h1>ဝက်ဘ်ဆိုက် ပြုပြင်မွမ်းမံနေပါသည်</h1>
        
        <p>
            လူကြီးမင်းတို့၏ အတွေ့အကြုံကို ပိုမိုကောင်းမွန်စေရန်အတွက် ကျွန်ုပ်တို့၏ ဝက်ဘ်ဆိုက်ကို ခေတ္တပိတ်ပြီး ပြုပြင်မွမ်းမံမှုများ ပြုလုပ်နေပါသည်။<br>
            မကြာမီ ပြန်လည်ဖွင့်လှစ်ပါမည်။
        </p>

        <a href="#" class="btn" onclick="location.reload()">ပြန်လည် ကြိုးစားကြည့်မည်</a>
    </div>

</body>
</html>
